[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xian-tech-wallet-cli"
version = "0.1.0"
description = "Localnet Xian wallet for terminals and agents"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.12,<3",
    "rich>=14,<16",
    "textual>=6,<9",
    "typer>=0.26,<1",
    "xian-tech-py>=0.5.3,<0.6",
]

[project.scripts]
xian-wallet = "xian_wallet_cli.cli:app"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.15,<0.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
